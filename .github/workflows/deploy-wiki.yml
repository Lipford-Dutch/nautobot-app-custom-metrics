---
name: "Deploy GitHub Wiki"

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: ~
  push:
    branches:
      - "develop"
    paths:
      - "wiki/**"
      - ".github/workflows/deploy-wiki.yml"

permissions:
  contents: "write"

concurrency:
  group: "deploy-wiki-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    name: "Deploy wiki"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"

      - name: "Validate wiki source"
        run: |
          test -f wiki/Home.md
          find wiki -maxdepth 1 -name '*.md' -type f | sort

      - name: "Publish wiki pages"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPOSITORY: "${{ github.repository }}"
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git" wiki-publish
          rsync -a --delete --exclude ".git" wiki/ wiki-publish/
          cd wiki-publish
          if git diff --quiet --exit-code; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git add .
          git commit -m "docs: sync project wiki"
          git push
