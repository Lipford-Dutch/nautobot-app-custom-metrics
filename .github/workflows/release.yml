---
name: "Release"

on:  # yamllint disable-line rule:truthy
  release:
    types: ["published"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish, for example v0.1.0."
        required: true
        type: "string"

permissions:
  contents: "read"

jobs:
  build:
    name: "Build package with poetry"
    runs-on: "ubuntu-latest"
    if: "startsWith(github.event.release.tag_name || inputs.tag || github.ref_name, 'v')"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"

      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v7"
        with:
          poetry-version: "2.1.3"
          python-version: "3.12"
          poetry-install-options: "--no-root"

      - name: "Build Documentation"
        run: "poetry run invoke build-and-check-docs"

      - name: "Run Poetry Build"
        run: "poetry build"

      - name: "Check that the release tag matches the version in pyproject.toml"
        env:
          RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        run: |
          if [ "${RELEASE_TAG}" != "v$(poetry version -s)" ]; then
            echo "Release tag ${RELEASE_TAG} does not match pyproject version v$(poetry version -s)."
            exit 1
          fi

      - name: "Upload package artifacts"
        uses: "actions/upload-artifact@v7"
        with:
          name: "distfiles"
          path: "dist/"
          if-no-files-found: "error"

  publish-github:
    name: "Publish package assets to GitHub Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    needs: "build"
    steps:
      - name: "Retrieve built package artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "distfiles"
          path: "dist/"

      - name: "Upload binaries to release"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        run: "gh release upload ${RELEASE_TAG} dist/*.{tar.gz,whl} --clobber"

  publish-pypi:
    name: "Publish package to PyPI"
    runs-on: "ubuntu-latest"
    if: "vars.PUBLISH_TO_PYPI == 'true'"
    needs: "build"
    environment: "pypi"
    permissions:
      # Security Standard: Required for PyPI Trusted Publishing; no long-lived PyPI API token is stored.
      id-token: "write"
    steps:
      - name: "Retrieve built package artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "distfiles"
          path: "dist/"

      - name: "Publish package distributions to PyPI"
        uses: "pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b"  # v1.14.0

  slack-notify:
    name: "Notify release publication"
    needs:
      - "publish-github"
      - "publish-pypi"
    if: "always() && needs.publish-github.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')"
    runs-on: "ubuntu-latest"
    env:
      SLACK_WEBHOOK_URL: "${{ secrets.OSS_PYPI_SLACK_WEBHOOK_URL }}"
      SLACK_WEBHOOK_TYPE: "INCOMING_WEBHOOK"
      SLACK_MESSAGE: >-
        *NOTIFICATION: NEW-RELEASE-PUBLISHED*\n
        Repository: <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>\n
        Release: <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}|${{ github.event.release.tag_name || inputs.tag || github.ref_name }}>\n
        Published by: <${{ github.server_url }}/${{ github.actor }}|${{ github.actor }}>
    steps:
      - name: "Send Slack notification"
        if: "${{ env.SLACK_WEBHOOK_URL != '' }}"
        uses: "slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c"  # v3.0.3
        with:
          payload: |
            {
              "text": "${{ env.SLACK_MESSAGE }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ env.SLACK_MESSAGE }}"
                  }
                }
              ]
            }

  create-pr-to-develop:
    name: "Create post-release PR to develop"
    needs:
      - "publish-github"
      - "publish-pypi"
    if: "always() && github.event.release.target_commitish == 'main' && needs.publish-github.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
      pull-requests: "write"
    steps:
      - name: "Check out main"
        uses: "actions/checkout@v6"
        with:
          ref: "main"
          fetch-depth: 0

      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v7"
        with:
          poetry-version: "2.1.3"
          poetry-install-options: "--no-root"

      - name: "Create release branch from main"
        id: "branch"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG_NAME: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        run: |
          if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "develop branch does not exist; skipping post-release PR."
            echo "branch_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TAG_NAME#v}"
          BRANCH_NAME="release-${VERSION}-to-develop"

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Release branch ${BRANCH_NAME} already exists."
            echo "branch_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -b "${BRANCH_NAME}"
          poetry version prepatch
          git add pyproject.toml
          git commit -m "Bump version"
          git push origin "${BRANCH_NAME}"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: "Create pull request to develop"
        if: "steps.branch.outputs.branch_name != ''"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh pr create \
            --title "Post release ${{ github.event.release.tag_name || inputs.tag || github.ref_name }} to develop" \
            --body "Please do a merge commit." \
            --base "develop" \
            --head "${{ steps.branch.outputs.branch_name }}"
